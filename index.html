<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Plan Visualizer</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <!-- Fully offline: no external requests, plan text never leaves the browser. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline' file:; font-src 'self' file:; img-src 'self' data:" />
  <style>
    @font-face { font-family: 'Poppins'; font-weight: 400; src: url('fonts/Poppins-Regular.woff2') format('woff2'); font-display: swap; }
    @font-face { font-family: 'Poppins'; font-weight: 500; src: url('fonts/Poppins-Medium.woff2') format('woff2'); font-display: swap; }
    @font-face { font-family: 'Poppins'; font-weight: 600; src: url('fonts/Poppins-SemiBold.woff2') format('woff2'); font-display: swap; }
    @font-face { font-family: 'Source Serif Pro'; font-weight: 400; src: url('fonts/SourceSerifPro-Regular.woff2') format('woff2'); font-display: swap; }

    :root {
      /* Terraform purple; solid fills keep the same value in both themes. */
      --brand-solid: #7B42BC;
      --brand-solid-hover: #5F2E96;
      --font-ui: 'Poppins', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      --font-serif: 'Source Serif Pro', Georgia, 'Times New Roman', serif;
      --font-mono: 'Roboto Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
      --focus-ring: 0 0 0 3px rgba(123,66,188,0.32);
      --header-h: 60px;
      --header-bg: #0C0C0E; --header-ink: #FFFFFF; --header-muted: #B2B6BD; --header-link: #BB8DEB; --header-hover: rgba(255,255,255,0.08);

      --bg: #FFFFFF; --panel: #FFFFFF; --sunk: #FAFAFA; --border: #E4E5E9; --border-strong: #C2C5CB;
      --ink: #0C0C0E; --muted: #656A76; --error: #C00005;
      --brand: #7B42BC; --brand-hover: #5F2E96; --brand-tint: #F4ECFF; --drop-tint: #F9F5FF;

      --create: #00781E;  --create-tint: #F2FBF6;
      --update: #1060FF;  --update-tint: #F2F8FF;
      --replace: #9E4B00; --replace-tint: #FFF9E8;
      --destroy: #C00005; --destroy-tint: #FFF5F5;
      --read: #656A76;    --read-tint: #F1F2F3;
      color-scheme: light;
    }
    :root[data-theme="dark"] {
      --focus-ring: 0 0 0 3px rgba(187,141,235,0.35);
      --bg: #0D0E12; --panel: #15181E; --sunk: #111318; --border: #2B2F37; --border-strong: #3B3D45;
      --ink: #EFEFF1; --muted: #B2B6BD; --error: #FF8F8F;
      --brand: #BB8DEB; --brand-hover: #D4B5F5; --brand-tint: rgba(187,141,235,0.12); --drop-tint: rgba(123,66,188,0.16);

      --create: #6BD68D;  --create-tint: rgba(107,214,141,0.10);
      --update: #7AAEFF;  --update-tint: rgba(122,174,255,0.10);
      --replace: #F5B35C; --replace-tint: rgba(245,179,92,0.10);
      --destroy: #FF8F8F; --destroy-tint: rgba(255,143,143,0.10);
      --read: #B2B6BD;    --read-tint: rgba(178,182,189,0.10);
      color-scheme: dark;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body { min-height: 100vh; background: var(--bg); color: var(--ink); font-family: var(--font-ui); }
    a { color: var(--brand); text-decoration: none; }
    a:hover { color: var(--brand-hover); text-decoration: underline; }
    [hidden] { display: none !important; }
    .mono { font-family: var(--font-mono); }
    .muted { color: var(--muted); }
    .overline { font-size: 11px; letter-spacing: 1.1px; text-transform: uppercase; color: var(--muted); }

    /* DS Button */
    .btn { font-family: var(--font-ui); font-weight: 500; line-height: 1; letter-spacing: 1.25px; border-radius: 4px;
      border: 1px solid transparent; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
      transition: background 150ms ease, color 150ms ease; }
    .btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }
    .btn-sm { padding: 8px 14px; font-size: 12px; }
    .btn-md { padding: 12px 20px; font-size: 14px; }
    .btn-primary { background: var(--brand-solid); border-color: var(--brand-solid); color: #fff; }
    .btn-primary:hover { background: var(--brand-solid-hover); border-color: var(--brand-solid-hover); }
    .btn-secondary { background: var(--panel); border-color: var(--brand); color: var(--brand); }
    .btn-secondary:hover { background: var(--brand-tint); }
    .btn-tertiary { background: transparent; color: var(--brand); }
    .btn-tertiary:hover { background: var(--brand-tint); }

    /* DS Chip */
    .chip { padding: 6px 12px; height: 28px; border-radius: 999px; font: 500 12px/1 var(--font-ui); cursor: pointer;
      background: var(--panel); color: var(--ink); border: 1px solid var(--border-strong); }
    .chip:focus-visible { outline: none; box-shadow: var(--focus-ring); }
    .chip[aria-pressed="true"] { background: var(--brand-solid); color: #fff; border-color: var(--brand-solid); }

    /* DS TextField */
    .field { height: 40px; border-radius: 4px; padding: 0 12px; background: var(--panel); border: 1px solid var(--border);
      display: flex; align-items: center; }
    .field:focus-within { border-color: var(--brand-solid); box-shadow: var(--focus-ring); }
    .field input { flex: 1; min-width: 0; border: none; outline: none; background: transparent; font: 400 14px/1 var(--font-ui); color: var(--ink); }

    header.top { position: sticky; top: 0; z-index: 20; height: var(--header-h); display: flex; align-items: center;
      justify-content: space-between; gap: 16px; padding: 0 28px; background: var(--header-bg); color: var(--header-ink);
      border-bottom: 2px solid var(--brand-solid); }
    header.top .title { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
    header.top .title strong { font-size: 17px; font-weight: 600; letter-spacing: -0.2px; white-space: nowrap; }
    header.top .title span { font-size: 12px; color: var(--header-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    header.top .actions { display: flex; align-items: center; gap: 10px; }
    header.top .btn-tertiary { color: var(--header-link); }
    header.top .btn-tertiary:hover { background: var(--header-hover); }

    /* Input view */
    .intake { max-width: 900px; margin: 0 auto; padding: 56px 28px 80px; }
    .intake h1 { font-family: var(--font-serif); font-weight: 400; font-size: 44px; line-height: 1.1; margin: 0 0 10px; }
    .intake p { font-size: 14px; line-height: 20px; color: var(--muted); max-width: 560px; margin: 0 0 28px; }
    .intake code { font-family: var(--font-mono); font-size: 12.5px; }
    .drop { padding: 16px; border-radius: 4px; border: 1px dashed var(--border); transition: all 150ms ease-out; }
    .drop.dragging { border-color: var(--brand-solid); background: var(--drop-tint); }
    .drop-hint { font-size: 13px; color: var(--muted); margin-bottom: 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .drop-hint label { color: var(--brand); cursor: pointer; }
    .drop-hint label:hover { text-decoration: underline; }
    textarea#raw { width: 100%; min-height: 260px; resize: vertical; padding: 16px; border-radius: 4px; border: 1px solid var(--border);
      background: var(--sunk); color: var(--ink); font-family: var(--font-mono); font-size: 12.5px; line-height: 19px; outline: none; }
    textarea#raw:focus { border-color: var(--brand-solid); box-shadow: var(--focus-ring); }
    .intake-actions { display: flex; align-items: center; gap: 12px; margin-top: 18px; flex-wrap: wrap; }
    .error { font-size: 12px; color: var(--error); }

    /* Plan view */
    .plan { padding: 24px 28px 80px; }
    .grid-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 12px; }
    .grid-insights { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; margin-bottom: 22px; }
    .card { padding: 14px 16px; border-radius: 4px; border: 1px solid var(--border); background: var(--panel); }
    .stat { display: flex; flex-direction: column; gap: 4px; border-left: 3px solid var(--c); }
    .stat .num { font-size: 32px; line-height: 34px; font-weight: 600; letter-spacing: -1px; color: var(--c); }
    .stat .num.zero { color: var(--muted); }
    .stat .note { font-size: 11.5px; color: var(--muted); }
    .mk { flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center; border-radius: 4px;
      background: var(--t); color: var(--c); font-family: var(--font-mono); line-height: 1; }
    .mk-18 { width: 18px; height: 18px; font-size: 12px; }
    .mk-20 { width: 20px; height: 20px; font-size: 12px; }
    .mk-22 { width: 22px; height: 22px; font-size: 13px; }
    .insight-value { font-size: 14px; line-height: 20px; }
    .insight-note { font-size: 11.5px; color: var(--muted); margin-top: 2px; word-break: break-word; }
    .card.risk { border-color: var(--destroy); background: var(--destroy-tint); }
    .card.risk .insight-value { font-weight: 500; }
    .banner { margin-bottom: 12px; padding: 12px 16px; border-radius: 4px; border: 1px solid var(--replace); background: var(--replace-tint);
      color: var(--ink); font-size: 13px; line-height: 19px; }
    .banner strong { color: var(--replace); }

    .toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; position: sticky;
      top: var(--header-h); z-index: 10; background: var(--bg); padding: 10px 0; }
    .toolbar .search { flex: 1 1 260px; min-width: 200px; }
    .toolbar .spacer { flex: 1 1 0; }
    .chips { display: flex; gap: 8px; flex-wrap: wrap; }

    .group { margin-bottom: 26px; }
    .group-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .group-head .t { font-size: 15px; font-weight: 600; }
    .group-head .n { font-size: 12px; color: var(--muted); }
    .group-body { border: 1px solid var(--border); border-radius: 4px; overflow: hidden; background: var(--panel); }
    .row { border-bottom: 1px solid var(--border); }
    .row:last-child { border-bottom: none; }
    .row-head { display: flex; align-items: center; gap: 12px; padding: 11px 14px; cursor: pointer; width: 100%;
      background: none; border: none; text-align: left; color: inherit; font: inherit; }
    .row-head:hover { background: var(--sunk); }
    .row-head:focus-visible { outline: none; box-shadow: inset var(--focus-ring); }
    .row-head .addr { font-family: var(--font-mono); font-size: 12.5px; line-height: 18px; word-break: break-all; flex: 1 1 auto; }
    .tag { flex: 0 0 auto; font-size: 10px; letter-spacing: 0.8px; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; }
    .tag.forces { background: var(--replace-tint); color: var(--replace); }
    .tag.danger { background: var(--destroy-tint); color: var(--destroy); }
    .row-head .meta { flex: 0 0 auto; font-size: 11px; color: var(--muted); }
    .row-head .chev { flex: 0 0 auto; font-size: 11px; color: var(--muted); width: 14px; text-align: center; }
    .row-body { padding: 4px 0 12px; background: var(--sunk); border-top: 1px solid var(--border); }
    .ln { font-family: var(--font-mono); font-size: 12px; line-height: 19px; white-space: pre-wrap; word-break: break-all;
      padding: 1px 16px; color: var(--muted); }
    .ln.add { color: var(--create); background: var(--create-tint); }
    .ln.del { color: var(--destroy); background: var(--destroy-tint); }
    .ln.chg { color: var(--update); background: var(--update-tint); }
    .ln.note { font-style: italic; }
    .more { padding: 10px 14px; font-size: 12px; color: var(--brand); cursor: pointer; border: none; border-top: 1px solid var(--border);
      background: none; width: 100%; text-align: left; font-family: var(--font-ui); }
    .more:hover { text-decoration: underline; }
    .empty { padding: 48px 0; text-align: center; font-size: 13px; color: var(--muted); }

    @media (max-width: 640px) {
      header.top, .plan, .intake { padding-left: 16px; padding-right: 16px; }
      header.top .title span { display: none; }
      .intake h1 { font-size: 34px; }
      .toolbar { position: static; }
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="title"><strong>Plan Visualizer</strong><span id="plan-label"></span></div>
    <div class="actions">
      <button type="button" class="btn btn-tertiary btn-sm" id="toggle-theme">Dark</button>
      <button type="button" class="btn btn-primary btn-sm" id="reset">New Plan</button>
    </div>
  </header>

  <main>
    <section class="intake" id="intake">
      <h1>Read the plan before you apply it.</h1>
      <p>Paste <code>terraform plan</code> console output, or drop a <code>terraform show -json</code> plan file. Nothing leaves your browser.</p>
      <div class="drop" id="drop">
        <div class="drop-hint">
          <span>Drop a .txt / .log / .json plan file here, or</span>
          <label for="file">choose a file</label>
          <input type="file" id="file" accept=".txt,.log,.json,text/plain,application/json" hidden />
        </div>
        <textarea id="raw" spellcheck="false" placeholder="Terraform will perform the following actions: ..."></textarea>
      </div>
      <div class="intake-actions">
        <button type="button" class="btn btn-primary btn-md" id="visualize">Visualize Plan</button>
        <button type="button" class="btn btn-secondary btn-md" id="load-sample">Load Example</button>
        <span class="error" id="parse-error" role="alert"></span>
      </div>
    </section>

    <section class="plan" id="plan" hidden>
      <div id="summary-warning"></div>
      <div class="grid-stats" id="stats"></div>
      <div class="grid-insights" id="insights"></div>
      <div class="toolbar">
        <div class="search">
          <div class="field"><input type="search" id="query" placeholder="Filter by address or type" aria-label="Filter by address or type" /></div>
        </div>
        <div class="chips" id="filters" role="group" aria-label="Filter by action"></div>
        <div class="spacer"></div>
        <button type="button" class="btn btn-tertiary btn-sm" id="expand-all">Expand All</button>
        <button type="button" class="btn btn-tertiary btn-sm" id="collapse-all">Collapse All</button>
      </div>
      <div id="groups"></div>
      <div class="empty" id="no-results" hidden>No resources match this filter.</div>
    </section>
  </main>

  <script>
    'use strict';

    const ACTIONS = {
      create:  { title: 'Create',  marker: '+',      note: 'new resources' },
      update:  { title: 'Update',  marker: '~',      note: 'in place' },
      replace: { title: 'Replace', marker: '±', note: 'destroy then create' },
      destroy: { title: 'Destroy', marker: '−', note: 'removed permanently' },
      read:    { title: 'Read',    marker: '<',      note: 'data sources' }
    };
    const ORDER = ['destroy', 'replace', 'update', 'create', 'read'];
    const PAGE = 100;
    const PAGE_STEP = 200;

    // Resource types whose destroy/replace can lose data or break consumers that pin to them.
    const STATEFUL = /^aws_(db_instance|rds_cluster|rds_cluster_instance|s3_bucket|ebs_volume|efs_file_system|dynamodb_table|elasticache_cluster|elasticache_replication_group|redshift_cluster|kms_key|secretsmanager_secret|docdb_cluster|neptune_cluster|ecr_repository|cloudwatch_log_group|msk_cluster|msk_serverless_cluster|opensearch_domain|elasticsearch_domain|backup_vault|sqs_queue|kinesis_stream|route53_zone|cognito_user_pool)$/;

    /* ───────────── Parsing ───────────── */

    function stripAnsi(s) { return s.replace(/\u001b\[[0-9;]*[A-Za-z]/g, ''); }

    function markerAction(m) {
      if (m === '+') return 'create';
      if (m === '-') return 'destroy';
      if (m === '~') return 'update';
      if (m === '-/+' || m === '+/-') return 'replace';
      if (m === '<=') return 'read';
      return 'update';
    }

    function parseSummary(text) {
      const line = text.split('\n').find(l => /^\s*Plan:\s/.test(l));
      if (!line) return null;
      const n = (re) => { const m = line.match(re); return m ? Number(m[1]) : 0; };
      return { add: n(/(\d+) to add/), change: n(/(\d+) to change/), destroy: n(/(\d+) to destroy/) };
    }

    function parseText(raw) {
      let lines = stripAnsi(raw).replace(/\r\n?/g, '\n').split('\n');
      // `cdktf diff` may prefix every line with the stack id. Terraform indents `# addr will be` by exactly
      // 2 spaces, so whatever precedes that is the prefix; strip it so block indentation lines up.
      const first = lines.find(l => /#\s+\S+\s+(will be|must be)/.test(l));
      const prefix = first ? first.slice(0, Math.max(0, first.indexOf('#') - 2)) : '';
      if (prefix) lines = lines.map(l => l.startsWith(prefix) ? l.slice(prefix.length) : l);
      const headerRe = /^(\s*)(-\/\+|\+\/-|<=|[+~-])(\s+)(resource|data)\s+"([^"]+)"\s+"([^"]+)"\s*\{\s*$/;
      const out = [];
      let lastAddress = null;
      let notes = [];
      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        const c = line.match(/^\s*#\s+(\S+)\s+(will be|must be|has been|will no longer be|is tainted)/);
        if (c) { lastAddress = c[1]; notes = [line.trim()]; continue; }
        if (lastAddress && /^\s*#\s+\(/.test(line)) { notes.push(line.trim()); continue; }
        const m = line.match(headerRe);
        if (!m) continue;
        const type = m[5];
        const address = lastAddress && lastAddress.indexOf(type + '.') >= 0 ? lastAddress : type + '.' + m[6];
        // Terraform closes the block with `}` at the column of the `resource`/`data` keyword.
        // Matching that indent avoids miscounting braces inside policy JSON, heredocs and strings.
        const closeIndent = m[1].length + m[2].length + m[3].length;
        const closeRe = new RegExp('^ {' + closeIndent + '}\\}\\s*$');
        const body = [];
        let j = i + 1;
        for (; j < lines.length && !closeRe.test(lines[j]); j++) body.push(lines[j]);
        i = j;
        out.push(buildResource(address, type, markerAction(m[2]), body, notes.slice(1)));
        lastAddress = null;
        notes = [];
      }
      return out;
    }

    function buildResource(address, type, action, bodyLines, notes) {
      let forces = false;
      const lines = notes.map(n => ({ m: '#', text: n }));
      for (const L of bodyLines) {
        if (!L.trim()) continue;
        if (/# forces replacement/.test(L)) forces = true;
        const m = L.match(/^\s*(-\/\+|\+\/-|[+~-])\s/);
        lines.push({ m: m ? (m[1].length > 1 ? '~' : m[1]) : ' ', text: L.replace(/\s+$/, '') });
      }
      const changed = lines.filter(l => l.m !== ' ' && l.m !== '#').length;
      return { address, type, action, forces, lines, changed };
    }

    function hasTrue(v) {
      if (v === true) return true;
      if (v && typeof v === 'object') return Object.values(v).some(hasTrue);
      return false;
    }

    function fmt(v) {
      if (v === undefined) return '(known after apply)';
      if (v === null) return 'null';
      if (typeof v === 'string') return JSON.stringify(v);
      if (typeof v === 'object') return JSON.stringify(v);
      return String(v);
    }

    function parseJson(raw) {
      const j = JSON.parse(raw);
      if (!j || typeof j !== 'object' || !Array.isArray(j.resource_changes)) {
        throw new Error('JSON has no resource_changes. Use `terraform show -json <planfile>`.');
      }
      const out = [];
      for (const rc of j.resource_changes) {
        const ch = rc.change || {};
        const acts = ch.actions || [];
        if (!acts.length || (acts.length === 1 && acts[0] === 'no-op')) continue;
        let action = 'update';
        if (acts.length > 1) action = 'replace';
        else if (acts[0] === 'create') action = 'create';
        else if (acts[0] === 'delete') action = 'destroy';
        else if (acts[0] === 'read') action = 'read';
        const before = ch.before || {};
        const after = ch.after || {};
        const unknown = ch.after_unknown || {};
        const sensitive = Object.assign({}, ch.before_sensitive || {}, ch.after_sensitive || {});
        const forcePaths = new Set((ch.replace_paths || []).map(p => String(p[0])));
        const keys = Array.from(new Set(Object.keys(before).concat(Object.keys(after), Object.keys(unknown)))).sort();
        const lines = [];
        for (const k of keys) {
          const b = before[k];
          const a = unknown[k] === true ? undefined : after[k];
          let bs = fmt(b), as = fmt(a);
          if (bs === as) continue;
          if (hasTrue(sensitive[k])) {
            bs = b === undefined ? bs : '(sensitive value)';
            as = unknown[k] === true ? as : '(sensitive value)';
          }
          let mk = '~';
          if (action === 'create') mk = '+';
          else if (action === 'destroy') mk = '-';
          else if (b === undefined || b === null) mk = '+';
          else if (a === null) mk = '-';
          const tail = forcePaths.has(k) && action === 'replace' ? '  # forces replacement' : '';
          const val = action === 'create' ? as : action === 'destroy' ? bs : bs + ' -> ' + as;
          lines.push({ m: mk, text: '      ' + mk + ' ' + k + ' = ' + val + tail });
        }
        out.push({
          address: rc.address, type: rc.type, action,
          forces: forcePaths.size > 0 && action === 'replace',
          lines, changed: lines.length
        });
      }
      return out;
    }

    /* ───────────── State ───────────── */

    const state = {
      resources: null, label: '', summary: null,
      query: '', filter: 'all', expanded: new Set(), limits: {}
    };

    const $ = (id) => document.getElementById(id);

    function el(tag, props, children) {
      const n = document.createElement(tag);
      if (props) for (const k in props) {
        if (k === 'class') n.className = props[k];
        else if (k === 'text') n.textContent = props[k];
        else if (k === 'style') n.setAttribute('style', props[k]);
        else if (k.startsWith('on')) n.addEventListener(k.slice(2), props[k]);
        else n.setAttribute(k, props[k]);
      }
      for (const c of [].concat(children || [])) if (c) n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
      return n;
    }

    function actionVars(a) { return '--c:var(--' + a + ');--t:var(--' + a + '-tint)'; }

    function isStateful(r) { return (r.action === 'destroy' || r.action === 'replace') && STATEFUL.test(r.type); }

    function ingest(text, label) {
      const t = text.trim();
      let resources = null, err = '', summary = null;
      if (!t) err = 'Paste a plan or drop a file first.';
      else {
        try {
          if (t.charAt(0) === '{') resources = parseJson(t);
          else { resources = parseText(t); summary = parseSummary(t); }
        } catch (e) { err = 'Could not parse: ' + e.message; }
        if (resources && !resources.length) err = 'Parsed successfully but found no resource changes.';
      }
      $('parse-error').textContent = err;
      if (err) return;
      Object.assign(state, { resources, label, summary, query: '', filter: 'all', expanded: new Set(), limits: {} });
      $('query').value = '';
      showPlan();
    }

    function readFile(file) {
      const r = new FileReader();
      r.onload = () => { $('raw').value = String(r.result); ingest(String(r.result), file.name); };
      r.onerror = () => { $('parse-error').textContent = 'Could not read ' + file.name + '.'; };
      r.readAsText(file);
    }

    // Injected as a <script> rather than fetched: browsers block fetch() on file://.
    function loadExample() {
      const show = () => { $('raw').value = window.EXAMPLE_PLAN; ingest(window.EXAMPLE_PLAN, 'Example plan'); };
      if (window.EXAMPLE_PLAN) return show();
      const s = document.createElement('script');
      s.src = 'samples/example-plan.js';
      s.onload = show;
      s.onerror = () => { s.remove(); $('parse-error').textContent = 'Could not load samples/example-plan.js.'; };
      document.head.appendChild(s);
    }

    /* ───────────── Rendering ───────────── */

    function counts() {
      const c = { create: 0, update: 0, replace: 0, destroy: 0, read: 0 };
      for (const r of state.resources) c[r.action]++;
      return c;
    }

    function visible() {
      const q = state.query.trim().toLowerCase();
      return state.resources.filter(r =>
        (state.filter === 'all' || r.action === state.filter) &&
        (!q || r.address.toLowerCase().indexOf(q) >= 0 || r.type.toLowerCase().indexOf(q) >= 0));
    }

    function showPlan() {
      $('intake').hidden = true;
      $('plan').hidden = false;
      const all = state.resources;
      $('plan-label').textContent = state.label + ' · ' + all.length + ' changed resources';
      renderOverview();
      renderFilters();
      renderGroups();
      window.scrollTo(0, 0);
    }

    function showIntake() {
      state.resources = null;
      $('plan').hidden = true;
      $('intake').hidden = false;
      $('plan-label').textContent = '';
      $('parse-error').textContent = '';
      $('raw').focus();
    }

    function renderOverview() {
      const all = state.resources;
      const c = counts();

      // Cross-check against Terraform's own summary so a parser miss never looks like a clean plan.
      const warn = $('summary-warning');
      warn.replaceChildren();
      const s = state.summary;
      if (s) {
        const got = { add: c.create + c.replace, change: c.update, destroy: c.destroy + c.replace };
        if (got.add !== s.add || got.change !== s.change || got.destroy !== s.destroy) {
          warn.appendChild(el('div', { class: 'banner', role: 'alert' }, [
            el('strong', { text: 'Counts do not match the Terraform summary. ' }),
            'Terraform reports ' + s.add + ' to add, ' + s.change + ' to change, ' + s.destroy + ' to destroy; this view parsed ' +
              got.add + ' / ' + got.change + ' / ' + got.destroy + '. Read the raw output before applying.'
          ]));
        }
      }

      $('stats').replaceChildren(...['create', 'update', 'replace', 'destroy'].map(a =>
        el('div', { class: 'card stat', style: actionVars(a) }, [
          el('div', { style: 'display:flex;align-items:center;gap:8px' }, [
            el('span', { class: 'mk mk-18', text: ACTIONS[a].marker }),
            el('span', { class: 'overline', text: ACTIONS[a].title })
          ]),
          el('div', { class: 'num' + (c[a] ? '' : ' zero'), text: String(c[a]) }),
          el('div', { class: 'note', text: ACTIONS[a].note })
        ])));

      const typeCount = {};
      const dangerTypes = new Set();
      let dangerCount = 0;
      for (const r of all) {
        typeCount[r.type] = (typeCount[r.type] || 0) + 1;
        if (isStateful(r)) { dangerCount++; dangerTypes.add(r.type); }
      }
      const top = Object.keys(typeCount).sort((a, b) => typeCount[b] - typeCount[a])[0];

      $('insights').replaceChildren(
        el('div', { class: 'card' }, [
          el('div', { class: 'overline', style: 'margin-bottom:8px', text: 'Most Touched Resource Type' }),
          el('div', { class: 'insight-value mono', text: top || '—' }),
          el('div', { class: 'insight-note', text: top ? typeCount[top] + ' of ' + all.length + ' changed resources' : '' })
        ]),
        el('div', { class: 'card' + (dangerCount ? ' risk' : '') }, [
          el('div', { class: 'overline', style: 'margin-bottom:8px', text: 'Data-Loss Risk' }),
          el('div', { class: 'insight-value', text: dangerCount === 0
            ? 'No stateful resources destroyed'
            : dangerCount + (dangerCount === 1 ? ' stateful resource' : ' stateful resources') + ' destroyed or replaced' }),
          el('div', { class: 'insight-note', text: dangerCount === 0
            ? 'No databases, buckets, queues, keys or volumes in the destroy set'
            : Array.from(dangerTypes).join(', ') })
        ])
      );
    }

    function renderFilters() {
      const c = counts();
      const defs = [['all', 'All', state.resources.length], ['create', '+ Create', c.create], ['update', '~ Update', c.update],
        ['replace', '± Replace', c.replace], ['destroy', '− Destroy', c.destroy]];
      if (c.read) defs.push(['read', '< Read', c.read]);
      $('filters').replaceChildren(...defs.map(([key, label, n]) =>
        el('button', {
          type: 'button', class: 'chip', 'aria-pressed': String(state.filter === key), text: label + ' ' + n,
          onclick: () => { state.filter = key; renderFilters(); renderGroups(); }
        })));
    }

    function renderRow(r) {
      const exp = state.expanded.has(r.address);
      const head = el('button', {
        type: 'button', class: 'row-head', 'aria-expanded': String(exp),
        onclick: () => { exp ? state.expanded.delete(r.address) : state.expanded.add(r.address); row.replaceWith(renderRow(r)); }
      }, [
        el('span', { class: 'mk mk-20', style: actionVars(r.action), text: ACTIONS[r.action].marker }),
        el('span', { class: 'addr', text: r.address }),
        r.forces ? el('span', { class: 'tag forces', text: 'forces replacement' }) : null,
        isStateful(r) ? el('span', { class: 'tag danger', text: 'stateful' }) : null,
        el('span', { class: 'meta', text: r.changed + (r.changed === 1 ? ' attr' : ' attrs') }),
        el('span', { class: 'chev', 'aria-hidden': 'true', text: exp ? '–' : '+' })
      ]);
      const row = el('div', { class: 'row' }, [head]);
      if (exp) {
        const cls = { '+': 'ln add', '-': 'ln del', '~': 'ln chg', '#': 'ln note', ' ': 'ln' };
        row.appendChild(el('div', { class: 'row-body' },
          r.lines.length ? r.lines.map(l => el('div', { class: cls[l.m], text: l.text }))
                         : [el('div', { class: 'ln', text: 'No attribute changes shown.' })]));
      }
      return row;
    }

    function renderGroups() {
      const vis = visible();
      $('no-results').hidden = vis.length > 0;
      $('groups').replaceChildren(...ORDER.filter(a => vis.some(r => r.action === a)).map(a => {
        const rows = vis.filter(r => r.action === a);
        const limit = state.limits[a] || PAGE;
        const shown = rows.slice(0, limit);
        const body = el('div', { class: 'group-body' }, shown.map(renderRow));
        if (rows.length > shown.length) {
          body.appendChild(el('button', {
            type: 'button', class: 'more',
            text: 'Show ' + Math.min(PAGE_STEP, rows.length - shown.length) + ' more of ' + rows.length,
            onclick: () => { state.limits[a] = limit + PAGE_STEP; renderGroups(); }
          }));
        }
        return el('div', { class: 'group' }, [
          el('div', { class: 'group-head' }, [
            el('span', { class: 'mk mk-22', style: actionVars(a), text: ACTIONS[a].marker }),
            el('span', { class: 't', text: ACTIONS[a].title }),
            el('span', { class: 'n', text: rows.length + (rows.length === 1 ? ' resource' : ' resources') })
          ]),
          body
        ]);
      }));
    }

    /* ───────────── Theme ───────────── */

    function applyTheme(dark) {
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      $('toggle-theme').textContent = dark ? 'Light' : 'Dark';
      try { localStorage.setItem('plan-visualizer-theme', dark ? 'dark' : 'light'); } catch (e) { /* storage unavailable */ }
    }

    (function initTheme() {
      let saved = null;
      try { saved = localStorage.getItem('plan-visualizer-theme'); } catch (e) { /* storage unavailable */ }
      applyTheme(saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches);
    })();

    /* ───────────── Events ───────────── */

    $('toggle-theme').addEventListener('click', () => applyTheme(document.documentElement.getAttribute('data-theme') !== 'dark'));
    $('reset').addEventListener('click', showIntake);
    $('visualize').addEventListener('click', () => ingest($('raw').value, 'Pasted plan'));
    $('load-sample').addEventListener('click', loadExample);
    $('file').addEventListener('change', (e) => { const f = e.target.files[0]; if (f) readFile(f); e.target.value = ''; });
    $('query').addEventListener('input', (e) => { state.query = e.target.value; renderGroups(); });
    $('expand-all').addEventListener('click', () => { visible().forEach(r => state.expanded.add(r.address)); renderGroups(); });
    $('collapse-all').addEventListener('click', () => { state.expanded.clear(); renderGroups(); });

    const drop = $('drop');
    drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('dragging'); });
    drop.addEventListener('dragleave', () => drop.classList.remove('dragging'));
    drop.addEventListener('drop', (e) => {
      e.preventDefault();
      drop.classList.remove('dragging');
      const f = e.dataTransfer.files[0];
      if (f) readFile(f);
    });
    // Dropping outside the zone would otherwise navigate the tab to the file.
    window.addEventListener('dragover', (e) => e.preventDefault());
    window.addEventListener('drop', (e) => e.preventDefault());
  </script>
</body>
</html>
